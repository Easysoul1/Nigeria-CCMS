services:
  - type: web
    name: ccms-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    branch: main
    buildCommand: >
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @court-ccms/server exec prisma generate &&
      pnpm --filter @court-ccms/server build
    startCommand: sh apps/server/scripts/render-entrypoint.sh
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: ALLOW_SEED
        value: "1"
      # Turso credentials (set in the Render dashboard)
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
